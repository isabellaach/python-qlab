[project]
name = "agente-socioeconomico-peru"
version = "0.1.0"
description = "Tarea 4: agente de investigación socioeconómica con un MCP del BCRP y Skills de la ENAHO 2024"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4,<5",
    "httpx",
    "pandas",
    "pyarrow",
    "geopandas",
    "matplotlib",
    "certifi",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["mcp"]
